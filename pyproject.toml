[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaoxi"
version = "0.1.0"
description = "A self-hosted WeChat personal agent built on OpenClaw"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<0.29",
  "Pillow>=11,<13",
  "qrcode>=8,<9",
  "fastembed==0.9.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
zhaoxi = "zhaoxi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhaoxi = ["static/*", "*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "data/tmp/pytest"
